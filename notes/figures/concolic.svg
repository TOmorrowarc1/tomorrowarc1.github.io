<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" font-family="Inter, Arial, sans-serif" role="img"><title>From one concrete run to another</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a45449"/></marker></defs><rect x="5.0" y="9" width="223.5" height="77" rx="12" fill="#fff9ef" stroke="#cf9d8d" stroke-width="2"/><text x="116.75" y="41.0" text-anchor="middle" font-size="20" fill="#382824">Concrete run</text><text x="116.75" y="68.0" text-anchor="middle" font-size="17" fill="#382824">x = 1, y = 1</text><rect x="260.5" y="9" width="223.5" height="77" rx="12" fill="#fff9ef" stroke="#cf9d8d" stroke-width="2"/><text x="372.25" y="41.0" text-anchor="middle" font-size="20" fill="#382824">Record constraints</text><text x="372.25" y="68.0" text-anchor="middle" font-size="17" fill="#382824">X &gt; 0 ∧ Y &gt; 0</text><path d="M231.5 48 L256.5 48" fill="none" stroke="#a45449" stroke-width="2" marker-end="url(#arrow)"/><rect x="516.0" y="9" width="223.5" height="77" rx="12" fill="#fff9ef" stroke="#cf9d8d" stroke-width="2"/><text x="627.75" y="41.0" text-anchor="middle" font-size="20" fill="#382824">Flip and solve</text><text x="627.75" y="68.0" text-anchor="middle" font-size="17" fill="#382824">X &gt; 0 ∧ Y ≤ 0</text><path d="M487.0 48 L512.0 48" fill="none" stroke="#a45449" stroke-width="2" marker-end="url(#arrow)"/><rect x="771.5" y="9" width="223.5" height="77" rx="12" fill="#f5ded2" stroke="#c65b55" stroke-width="2"/><text x="883.25" y="41.0" text-anchor="middle" font-size="20" fill="#382824">New run</text><text x="883.25" y="68.0" text-anchor="middle" font-size="17" fill="#382824">x = 1, y = 0</text><path d="M742.5 48 L767.5 48" fill="none" stroke="#a45449" stroke-width="2" marker-end="url(#arrow)"/></svg>
