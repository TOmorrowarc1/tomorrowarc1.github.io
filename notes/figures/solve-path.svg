<svg xmlns="http://www.w3.org/2000/svg" width="940" height="96" viewBox="0 0 940 96" font-family="Inter, Arial, sans-serif" role="img"><title>Solving a path condition</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a45449"/></marker></defs><rect x="5.0" y="9" width="208.5" height="77" rx="12" fill="#fff9ef" stroke="#cf9d8d" stroke-width="2"/><text x="109.25" y="41.0" text-anchor="middle" font-size="20" fill="#382824">Branch decisions</text><text x="109.25" y="68.0" text-anchor="middle" font-size="17" fill="#382824">True, then false</text><rect x="245.5" y="9" width="208.5" height="77" rx="12" fill="#fff9ef" stroke="#cf9d8d" stroke-width="2"/><text x="349.75" y="41.0" text-anchor="middle" font-size="20" fill="#382824">Conjoin predicates</text><text x="349.75" y="68.0" text-anchor="middle" font-size="17" fill="#382824">X &gt; 0 ∧ Y ≤ 0</text><path d="M216.5 48 L241.5 48" fill="none" stroke="#a45449" stroke-width="2" marker-end="url(#arrow)"/><rect x="486.0" y="9" width="208.5" height="77" rx="12" fill="#fff9ef" stroke="#cf9d8d" stroke-width="2"/><text x="590.25" y="41.0" text-anchor="middle" font-size="20" fill="#382824">Solve with SMT</text><text x="590.25" y="68.0" text-anchor="middle" font-size="17" fill="#382824">X = 1, Y = 0</text><path d="M457.0 48 L482.0 48" fill="none" stroke="#a45449" stroke-width="2" marker-end="url(#arrow)"/><rect x="726.5" y="9" width="208.5" height="77" rx="12" fill="#f5ded2" stroke="#c65b55" stroke-width="2"/><text x="830.75" y="41.0" text-anchor="middle" font-size="20" fill="#382824">Replay</text><text x="830.75" y="68.0" text-anchor="middle" font-size="17" fill="#382824">score(1, 0) = 1</text><path d="M697.5 48 L722.5 48" fill="none" stroke="#a45449" stroke-width="2" marker-end="url(#arrow)"/></svg>
